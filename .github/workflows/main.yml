name: Build Docker Image on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          docker build -t my-web:${{ github.ref_name }} .
          echo "Successfully built image tagged with ${{ github.ref_name }}"